version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: barbershop_db
    environment:
      POSTGRES_DB: barbershop
      POSTGRES_USER: barbershop
      POSTGRES_PASSWORD: barbershop_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Postgres corre alfabéticamente todo lo que encuentre acá al iniciar el contenedor
      # por primera vez — por eso las migraciones ya están numeradas 001, 002, etc.
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbershop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
